<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-labelledby="t d">
  <title id="t">Pose-to-Interaction (P2I) framework</title>
  <desc id="d">Schematic of the survey's three-layer framework: a head with yaw, pitch and roll axes feeds a Perception layer (temporally coherent 3D orientation), then a Semantics layer (attention, gesture, internal state), then an Interaction layer (closed-loop behaviour in HCI and HRI), with a feedback loop back to perception.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e3e8ef"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e11d48"/></marker>
    <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
    <marker id="arrowZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>

  <rect width="1400" height="800" fill="#ffffff"/>
  <rect width="1400" height="800" fill="url(#dots)"/>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- Heading -->
    <text x="430" y="118" font-size="44" font-weight="800" fill="#0f172a">Pose-to-Interaction (P2I)</text>
    <text x="432" y="160" font-size="25" fill="#475569">head pose as an interaction signal, not just a geometric target</text>

    <!-- Head with orientation axes -->
    <g transform="translate(212 385)">
      <path d="M-92 -10 C-92 -88 -40 -128 18 -128 C86 -128 118 -78 116 -18 C115 8 130 22 138 38 C142 46 136 52 126 54 L118 56 C118 72 116 92 104 100 C92 108 70 104 58 106 L56 140 L-58 140 L-62 82 C-84 60 -92 30 -92 -10 Z"
            fill="#f1f5f9" stroke="#334155" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="72" cy="-22" r="7" fill="#334155"/>
      <path d="M-20 -24 C-6 -36 8 -20 -4 -6 C-14 4 -26 -2 -20 -24" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <!-- axes -->
      <line x1="10" y1="-10" x2="168" y2="-10" stroke="#e11d48" stroke-width="5" marker-end="url(#arrowX)"/>
      <line x1="10" y1="-10" x2="10" y2="-215" stroke="#16a34a" stroke-width="5" marker-end="url(#arrowY)"/>
      <line x1="10" y1="-10" x2="-120" y2="150" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowZ)"/>
      <circle cx="10" cy="-10" r="8" fill="#0f172a"/>
      <!-- rotation arcs -->
      <path d="M-42 -176 A52 15 0 1 0 62 -176" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowY)"/>
      <text x="74" y="-196" font-size="24" font-weight="700" fill="#16a34a">yaw</text>
      <path d="M146 -48 A15 46 0 1 1 146 30" fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#arrowX)"/>
      <text x="150" y="76" font-size="24" font-weight="700" fill="#e11d48">roll</text>
      <path d="M-146 120 A30 13 -50 1 1 -104 168" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowZ)"/>
      <text x="-196" y="112" font-size="24" font-weight="700" fill="#2563eb">pitch</text>
    </g>

    <!-- Arrow head -> perception -->
    <line x1="398" y1="375" x2="440" y2="375" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- Layer 1: Perception -->
    <g transform="translate(450 215)">
      <rect width="270" height="320" rx="22" fill="#e6efff" stroke="#3b6fd8" stroke-width="4"/>
      <rect width="270" height="70" rx="22" fill="#3b6fd8"/>
      <rect y="40" width="270" height="30" fill="#3b6fd8"/>
      <circle cx="38" cy="35" r="20" fill="#ffffff"/>
      <text x="38" y="44" font-size="24" font-weight="800" fill="#3b6fd8" text-anchor="middle">1</text>
      <text x="70" y="45" font-size="28" font-weight="800" fill="#ffffff">Perception</text>
      <text x="24" y="118" font-size="23" font-weight="700" fill="#1e3a8a">3D orientation</text>
      <text x="24" y="152" font-size="21" fill="#334155">yaw · pitch · roll</text>
      <text x="24" y="184" font-size="21" fill="#334155">under sensing limits</text>
      <!-- pose trajectory sparkline -->
      <path d="M24 270 C54 222 76 222 98 252 S142 296 166 254 S212 214 246 246" fill="none" stroke="#3b6fd8" stroke-width="4" stroke-linecap="round"/>
      <path d="M24 270 C54 236 76 240 98 262 S142 300 166 266 S212 232 246 258" fill="none" stroke="#93b4f0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 7"/>
      <text x="24" y="304" font-size="18" fill="#3b6fd8" font-weight="600">temporally coherent</text>
    </g>

    <line x1="728" y1="375" x2="770" y2="375" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- Layer 2: Semantics -->
    <g transform="translate(780 215)">
      <rect width="270" height="320" rx="22" fill="#fff5d9" stroke="#c99000" stroke-width="4"/>
      <rect width="270" height="70" rx="22" fill="#c99000"/>
      <rect y="40" width="270" height="30" fill="#c99000"/>
      <circle cx="38" cy="35" r="20" fill="#ffffff"/>
      <text x="38" y="44" font-size="24" font-weight="800" fill="#c99000" text-anchor="middle">2</text>
      <text x="70" y="45" font-size="28" font-weight="800" fill="#ffffff">Semantics</text>
      <g font-size="22" fill="#5c4300">
        <rect x="22" y="96" width="226" height="50" rx="25" fill="#ffffff" stroke="#e6c35c" stroke-width="3"/>
        <text x="135" y="129" text-anchor="middle" font-weight="700">attention</text>
        <rect x="22" y="160" width="226" height="50" rx="25" fill="#ffffff" stroke="#e6c35c" stroke-width="3"/>
        <text x="135" y="193" text-anchor="middle" font-weight="700" font-size="20">gesture · nod / shake</text>
        <rect x="22" y="224" width="226" height="50" rx="25" fill="#ffffff" stroke="#e6c35c" stroke-width="3"/>
        <text x="135" y="257" text-anchor="middle" font-weight="700">internal state</text>
      </g>
      <text x="24" y="304" font-size="18" fill="#a37400" font-weight="600">probabilistic intention</text>
    </g>

    <line x1="1058" y1="375" x2="1100" y2="375" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

    <!-- Layer 3: Interaction -->
    <g transform="translate(1110 215)">
      <rect width="270" height="320" rx="22" fill="#f1e8ff" stroke="#7c4ddb" stroke-width="4"/>
      <rect width="270" height="70" rx="22" fill="#7c4ddb"/>
      <rect y="40" width="270" height="30" fill="#7c4ddb"/>
      <circle cx="38" cy="35" r="20" fill="#ffffff"/>
      <text x="38" y="44" font-size="24" font-weight="800" fill="#7c4ddb" text-anchor="middle">3</text>
      <text x="70" y="45" font-size="28" font-weight="800" fill="#ffffff">Interaction</text>
      <text x="24" y="118" font-size="23" font-weight="700" fill="#3b1d80">closed-loop</text>
      <text x="24" y="150" font-size="23" font-weight="700" fill="#3b1d80">system behaviour</text>
      <rect x="24" y="178" width="102" height="52" rx="12" fill="#ffffff" stroke="#7c4ddb" stroke-width="3"/>
      <text x="75" y="213" font-size="24" font-weight="800" fill="#7c4ddb" text-anchor="middle">HCI</text>
      <rect x="144" y="178" width="102" height="52" rx="12" fill="#ffffff" stroke="#7c4ddb" stroke-width="3"/>
      <text x="195" y="213" font-size="24" font-weight="800" fill="#7c4ddb" text-anchor="middle">HRI</text>
      <text x="24" y="276" font-size="18" fill="#5b36b0" font-weight="600">control &amp; throughput →</text>
      <text x="24" y="304" font-size="18" fill="#5b36b0" font-weight="600">social appropriateness</text>
    </g>

    <!-- Feedback loop -->
    <path d="M1245 545 L1245 612 Q1245 626 1231 626 L599 626 Q585 626 585 612 L585 553" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#arrow)"/>
    <rect x="808" y="608" width="194" height="36" rx="18" fill="#ffffff"/>
    <text x="905" y="634" font-size="22" font-weight="700" fill="#475569" text-anchor="middle">closed loop</text>

    <!-- Metric gap -->
    <g transform="translate(450 680)">
      <rect width="930" height="68" rx="16" fill="#fff1e8" stroke="#e8590c" stroke-width="3" stroke-dasharray="10 7"/>
      <text x="465" y="44" font-size="25" fill="#9a3412" text-anchor="middle"><tspan font-weight="800">metric gap:</tspan> benchmark angular accuracy ≠ real-world interaction quality</text>
    </g>
  </g>
</svg>
